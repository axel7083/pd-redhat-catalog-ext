# The catalog APIs (Hydra Solr and Pyxis GraphQL) are internal and unversioned:
# detect drift weekly instead of discovering it from user reports.
name: catalog-api-drift

permissions:
  contents: read

on:
  schedule:
    # every Monday at 4am UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  drift:
    name: Pyxis schema and contract tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Build shared package
        run: pnpm build:shared

      - name: Download the Pyxis GraphQL schema and regenerate the types
        run: |
          pnpm pyxis:schema
          pnpm pyxis:codegen

      - name: Fail on schema or generated types drift
        run: git diff --exit-code -- packages/backend/pyxis packages/backend/src/pyxis/generated

      - name: Run contract tests against the live APIs
        if: ${{ !cancelled() }}
        run: pnpm test:contract
